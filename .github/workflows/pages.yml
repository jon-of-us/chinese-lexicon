name: Deploy to GitHub Pages

on:
  push:
    branches: [publish-no-training]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        run: npx vite build --base=${{ steps.pages.outputs.base_path }}/
      # GitHub Pages has no SPA fallback, so unknown deep links (for example /character/X) load the app shell.
      - name: Add SPA fallback
        working-directory: app/dist
        run: cp index.html 404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
